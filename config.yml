# 时序预测模型全局配置文件

# 1. 基础配置
target_column: 'RMS_Value'         # 预测目标列名，需与 CSV 文件中的列名一致
random_seed: 42                    # 全局随机种子
data_dir: ""                       # 数据文件夹路径 (留空或路径无效则会弹出GUI让你选择)
result_root: "result"              # 结果保存根目录

# 2. 模型结构参数 (为了网格搜索，部分参数设计为列表)
input_size: 1                      # 输入特征维度 (单变量RMS)
hidden_size: [64, 128, 256]          # 隐藏层大小列表
num_layers: [1, 2, 3, 4]               # 网络层数列表
dropout: [0.15, 0.3]                # Dropout 比率列表
use_layer_norm: True               # 仅对 Vanilla LSTM 有效
use_residual: True                 # 是否启用残差预测

# 3. 数据过滤
value_threshold: 0.009             # 只保留 >= 此值的正常运行点，低于此值的停机数据丢弃

# 4. 序列长度与数据切分
seq_length: [120, 240]         # 输入序列长度（运行点的个数）
output_size: [24]               # 预测步长（运行点的个数）
test_size: 0.15                    # 测试集占比
val_size: 0.15                     # 验证集占比
stride: null                        # 滑动窗口步长 (null=自动计算, 或手动指定)

# 5. 训练过程与优化器参数
epochs: 400                        # 最大训练轮数
batch_size: 64                     # 批处理大小
learning_rate: [0.0002, 0.0005, 0.001]  # 学习率列表
patience: [12, 18]             # 早停耐心值列表
loss_type: ['huber', 'mse']        # 损失函数类型列表
weight_decay: [0, 0.00001, 0.0001]      # AdamW 权重衰减
grad_clip: 1.0                     # 梯度裁剪阈值
