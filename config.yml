# 时序预测模型全局配置文件

# 1. 基础配置
target_column: 'RMS_Value'         # 预测目标列名，需与 CSV 文件中的列名一致
random_seed: 42                    # 全局随机种子
data_dir: ""                       # 数据文件夹路径 (留空或路径无效则会弹出GUI让你选择)
result_root: "result"              # 结果保存根目录

# 2. 模型结构参数 (为了网格搜索，部分参数设计为列表)
input_size: 1                      # 输入特征维度 (use_time_features=True 时自动变为 3)
output_feature_size: 1             # 输出特征维度 (主要用于 Seq2Seq 模型解耦)
hidden_size: [64, 128, 256]          # 隐藏层大小列表
num_layers: [3, 4]                 # 网络层数列表
dropout: [0.3, 0.15]                     # Dropout 比率列表
use_layer_norm: True               # 仅对 Vanilla LSTM 有效
use_time_features: True            # 🆕 是否加入 sin/cos 时间编码 (一天中的第几个半小时)
use_residual: True                 # 🆕 是否启用残差预测 (预测明天与今天的差值)

# 3. 序列长度与数据切分
seq_length: 658                     # 输入序列长度（历史时间步数）
output_size: 47                     # 输出序列长度（预测未来时间步数）
test_size: 0.15                    # 测试集占比
val_size: 0.15                     # 验证集占比

# 4. 训练过程与优化器参数
epochs: 400                        # 最大训练轮数
batch_size: 64                     # 🎯 新增：批处理大小 (推荐 32, 64 或 128)
learning_rate: [0.0005]            # 学习率列表
patience: [15]                     # 早停耐心值列表
loss_type: ['huber', 'mse']        # 损失函数类型列表
grad_clip: 1.0                     # 梯度裁剪阈值